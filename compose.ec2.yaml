services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gasvolcan}
      MYSQL_USER: ${DB_USER:-gasvolcan}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe estar definido en .env.aws}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD debe estar definido en .env.aws}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gas-volcan-backend
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_NAME: ${DB_NAME:-gasvolcan}
      DB_USER: ${DB_USER:-gasvolcan}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe estar definido en .env.aws}
      # El perfil docker lee estas mismas variables que application.properties
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe estar definido en .env.aws}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://Cr1stoph.github.io}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/var/www/gas-volcan:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  certbot_conf:
  certbot_www:
