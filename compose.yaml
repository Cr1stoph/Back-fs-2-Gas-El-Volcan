services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gasvolcan}
      MYSQL_USER: ${DB_USER:-gasvolcan}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gasvolcan}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${DB_ROOT_PASSWORD:-root1234}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gas-volcan-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_NAME: ${DB_NAME:-gasvolcan}
      DB_USER: ${DB_USER:-gasvolcan}
      DB_PASSWORD: ${DB_PASSWORD:-gasvolcan}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe estar definido en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
