spring.datasource.url=jdbc:mysql://${APP_DB_HOST:db}:3306/${APP_DB_NAME:gasvolcan}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${APP_DB_USER:gasvolcan}
spring.datasource.password=${APP_DB_PASSWORD:gasvolcan}
spring.jpa.hibernate.ddl-auto=update
server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
jwt.expiration=${APP_JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
