spring.application.name=gasVolcan
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/gas-volcan;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# JWT (valores por defecto para desarrollo; sobreescribir en producción)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
