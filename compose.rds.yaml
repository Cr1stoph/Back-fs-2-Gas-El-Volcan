services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gas-volcan-backend
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST:?DB_HOST debe ser el endpoint de RDS}
      DB_NAME: ${DB_NAME:-gasvolcan}
      DB_USER: ${DB_USER:?DB_USER debe estar definido en .env.aws}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe estar definido en .env.aws}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe estar definido en .env.aws}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://Cr1stoph.github.io}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  certbot_conf:
  certbot_www:
