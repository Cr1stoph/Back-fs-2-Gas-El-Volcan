name: Deploy backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ec2-backend
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        run: ./mvnw test

      - name: Package backend
        run: ./mvnw -B -DskipTests package

      - name: Create SSH directory
        run: mkdir -p ~/.ssh

      - name: Configure EC2 SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H -p "${EC2_PORT:-22}" "$EC2_HOST" >> ~/.ssh/known_hosts || true

      - name: Package deployment
        run: tar -czf /tmp/gas-volcan.tar.gz --exclude=.git --exclude=data .

      - name: Create deployment environment
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          {
            printf 'DB_NAME=gasvolcan\n'
            printf 'DB_USER=gasvolcan\n'
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD"
            printf 'DB_HOST=db\n'
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_EXPIRATION=86400000\n'
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_ALLOWED_ORIGINS"
          } > /tmp/gas-volcan.env
          chmod 600 /tmp/gas-volcan.env

      - name: Upload deployment package
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" "sudo mkdir -p /opt/gas-volcan && sudo chown -R $EC2_USER /opt/gas-volcan"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key -P "${EC2_PORT:-22}" /tmp/gas-volcan.tar.gz "$EC2_USER@$EC2_HOST:/tmp/gas-volcan.tar.gz"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key -P "${EC2_PORT:-22}" /tmp/gas-volcan.env "$EC2_USER@$EC2_HOST:/tmp/gas-volcan.env"

      - name: Deploy and verify health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" \
            "mkdir -p /opt/gas-volcan && tar -xzf /tmp/gas-volcan.tar.gz -C /opt/gas-volcan && \
             install -m 600 /tmp/gas-volcan.env /opt/gas-volcan/.env.aws && \
             cd /opt/gas-volcan && chmod +x scripts/desplegar-ec2.sh && \
             ./scripts/desplegar-ec2.sh"
